{% extends "base.html" %}
{% block title %}Add Student{% endblock %}
{% block content %}
<div class="topbar">
  <h4>Add New Student</h4>
  <a href="{{ url_for('admin_students') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header"><h6>Student Details & Login Account</h6></div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Full Name *</label>
              <input type="text" name="name" class="form-control" placeholder="e.g. Aman Kumar Raj" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Roll Number *</label>
              <input type="text" name="roll_number" class="form-control" placeholder="e.g. CSB23068" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Department *</label>
              <select name="department" class="form-select" required>
                <option value="">– Select –</option>
                {% for d in departments %}<option value="{{ d.name }}">{{ d.name }}</option>{% endfor %}
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold">Semester *</label>
              <select name="semester" class="form-select" required>
                {% for i in range(1,9) %}<option value="{{ i }}">Semester {{ i }}</option>{% endfor %}
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold">Section</label>
              <select name="section" class="form-select">
                <option value="A">A</option><option value="B">B</option><option value="C">C</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" name="email" class="form-control" placeholder="student@university.edu">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Phone</label>
              <input type="text" name="phone" class="form-control" placeholder="10-digit number">
            </div>
            <div class="col-12"><hr class="my-1"><p class="text-muted mb-2" style="font-size:12px;">Login credentials for student portal:</p></div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Username</label>
              <input type="text" name="username" class="form-control" placeholder="Leave blank to use roll number">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Password</label>
              <input type="text" name="password" class="form-control" placeholder="Leave blank to use roll number">
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 mt-4"><i class="bi bi-person-plus me-2"></i>Add Student</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
