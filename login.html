{% extends "base.html" %}
{% block title %}Add Teacher{% endblock %}
{% block content %}
<div class="topbar">
  <h4>Add New Teacher</h4>
  <a href="{{ url_for('admin_teachers') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card">
      <div class="card-header"><h6>Teacher Details & Login Account</h6></div>
      <div class="card-body p-4">
        <form method="POST">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Full Name *</label>
              <input type="text" name="name" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Employee ID *</label>
              <input type="text" name="employee_id" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Department *</label>
              <select name="department" class="form-select" required>
                <option value="">– Select –</option>
                {% for d in departments %}<option value="{{ d.name }}">{{ d.name }}</option>{% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Email</label>
              <input type="email" name="email" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Phone</label>
              <input type="text" name="phone" class="form-control">
            </div>
            <div class="col-12"><hr class="my-1"><p class="text-muted mb-2" style="font-size:12px;">Assign Subjects:</p>
              <div class="row g-2">
                {% for s in subjects %}
                <div class="col-md-6">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="subject_ids" value="{{ s.id }}" id="sub{{ s.id }}">
                    <label class="form-check-label" for="sub{{ s.id }}" style="font-size:12px;">{{ s.name }} ({{ s.code }}) – Sem {{ s.semester }}</label>
                  </div>
                </div>
                {% endfor %}
              </div>
            </div>
            <div class="col-12"><hr class="my-1"><p class="text-muted mb-2" style="font-size:12px;">Login credentials:</p></div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Username</label>
              <input type="text" name="username" class="form-control" placeholder="Leave blank to use Employee ID">
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Password</label>
              <input type="text" name="password" class="form-control" placeholder="Leave blank to use Employee ID">
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 mt-4"><i class="bi bi-person-badge me-2"></i>Add Teacher</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
