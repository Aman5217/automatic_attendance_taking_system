<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login – UniAttend</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:linear-gradient(135deg,#2E4057 0%,#048A81 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',sans-serif;}
.login-card{background:#fff;border-radius:16px;padding:40px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.logo{text-align:center;margin-bottom:28px;}
.logo .icon{font-size:3rem;margin-bottom:8px;}
.logo h4{color:#2E4057;font-weight:700;margin:0;}
.logo small{color:#6c757d;font-size:13px;}
.form-label{font-size:12px;font-weight:600;color:#495057;text-transform:uppercase;letter-spacing:.04em;}
.form-control{border-radius:8px;padding:10px 14px;font-size:13px;}
.form-control:focus{border-color:#048A81;box-shadow:0 0 0 .2rem rgba(4,138,129,.2);}
.btn-login{background:#2E4057;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:600;width:100%;color:#fff;}
.btn-login:hover{background:#1e2d40;}
.role-hints{margin-top:20px;border-top:1px solid #eee;padding-top:16px;}
.role-badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;margin:2px;}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <div class="icon">🎓</div>
    <h4>UniAttend</h4>
    <small>University Attendance Management System</small>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
    <div class="alert alert-{{ cat }} alert-dismissible fade show py-2 px-3" style="font-size:13px;">
      {{ msg }}<button type="button" class="btn-close btn-sm" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
    </div>
    <div class="mb-4">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
    </div>
    <button type="submit" class="btn-login">Login →</button>
  </form>

  <div class="role-hints">
    <p style="font-size:11px;color:#6c757d;margin-bottom:8px;">Default accounts:</p>
    <span class="role-badge" style="background:#e8eef7;color:#2E4057;">Admin: admin / admin123</span>
    <p style="font-size:10px;color:#aaa;margin-top:8px;">Teacher & Student accounts are created by the Admin.</p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
